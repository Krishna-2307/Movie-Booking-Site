<!DOCTYPE html>
<html lang="en">
<head>
    <title>Movie-Booking: Sign-in</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f7f7f7;
            background-image: url(./pictures/signupposter.jpg);
            background-repeat: no-repeat;
            background-size: cover;
            background-position: center;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin-top: 300px;
            margin-bottom: 300px;
        }

        .form-container {
            background-color: white;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.9);
            width: 400px;
            position: relative;
            top: -260px;
        }

        .form-items {
            width: 100%;
            padding: 10px;
            margin-top: 15px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 16px;
            box-sizing: border-box;
        }

        .form-items:focus {
            border-color: #007bff;
            outline: none;
            box-shadow: 0 0 5px rgba(0, 123, 255, 0.5);
        }

        .form-title {
            text-align: center;
            margin-bottom: 20px;
            font-size: 24px;
            color: #333;
        }

        .form-button {
            width: 100%;
            padding: 10px;
            margin-top: 15px;
            border: none;
            border-radius: 5px;
            background-color: #007bff;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        .reset{
            width: 100%;
            padding: 10px;
            margin-top: 15px;
            border: 1px solid black;
            border-radius: 5px;
            color: black;
            font-size: 16px;
            cursor: pointer;
        }

        .form-button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>
    <div class="form-container">   

        <div class="form-title">Sign In</div>
        <input type="username" placeholder="User Name" class="form-items">
        <input type="password" placeholder="Password" class="form-items">
        <br><br>

        <button class="form-button">Submit</button>
        <button class="reset">Reset</button>
        
    </div>
</body>
</html>
